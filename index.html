<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>조선 로우폴리 데모</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
      .layer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #15110e; color: #f3ead6;
               font-family: "AppleMyungjo", "Nanum Myeongjo", "Noto Serif KR", "Batang", serif; text-align: center; padding: 16px; box-sizing: border-box; }
      .card { max-width: 560px; width: 100%; }
      h1 { font-size: 26px; font-weight: normal; letter-spacing: .08em; margin: 0 0 18px; }
      #bar { height: 6px; background: #3a2f27; border-radius: 3px; overflow: hidden; margin: 0 auto 10px; max-width: 320px; }
      #fill { height: 100%; width: 0; background: #c8553d; transition: width .2s; }
      #pct { font-size: 14px; opacity: .7; }
      table { margin: 0 auto 20px; border-collapse: collapse; font-size: 15px; line-height: 1.7; }
      td { padding: 0 10px; text-align: left; vertical-align: top; } td:first-child { color: #e0a96d; white-space: nowrap; text-align: right; }
      button { font: inherit; font-size: 18px; color: #15110e; background: #f3ead6; border: 0; border-radius: 6px; padding: 10px 36px; cursor: pointer; }
      #rotate { display: none; z-index: 10; font-size: 20px; }
      @media (orientation: portrait) { body.mobile #rotate { display: flex; } }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading" class="layer"><div class="card">
      <h1>조선 로우폴리</h1>
      <div id="bar"><div id="fill"></div></div><div id="pct">불러오는 중…</div>
    </div></div>
    <div id="start" class="layer hidden"><div class="card">
      <h1>조선 로우폴리</h1>
      <table id="keys-pc">
        <tr><td>이동</td><td>W A S D · Shift 달리기 · Space 점프</td></tr>
        <tr><td>시점</td><td>마우스 (클릭하면 잠김, Esc 풀기) · V 1인칭</td></tr>
        <tr><td>상호작용</td><td>F · 책장에서는 방향키, Esc 닫기</td></tr>
        <tr><td>지도</td><td>Tab 쪽지 지도 · M 미니맵 크게</td></tr>
      </table>
      <table id="keys-mobile" class="hidden">
        <tr><td>이동</td><td>왼쪽을 엄지로 밀기 · 끝까지 밀면 달리기</td></tr>
        <tr><td>시점</td><td>오른쪽을 끌기 · 시점 버튼 1인칭</td></tr>
        <tr><td>상호작용</td><td>F 버튼 · 책장에서는 왼쪽 엄지로 고르기</td></tr>
        <tr><td>지도</td><td>지도 버튼 · 미니맵 버튼</td></tr>
      </table>
      <button id="go">시작</button>
    </div></div>
    <div id="rotate" class="layer">휴대폰을 가로로 돌려 주세요</div>
    <script src="Build/Web.loader.js"></script>
    <script>
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)) || /touch=1/.test(location.search);
      // an iPad's Safari says "Macintosh": tell the game to show the touch controls (it reads the address)
      if (mobile && !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && !/touch=1/.test(location.search))
        history.replaceState(null, "", location.pathname + (location.search ? location.search + "&" : "?") + "touch=1" + location.hash);
      if (mobile) { document.body.classList.add("mobile"); document.getElementById("keys-pc").classList.add("hidden"); document.getElementById("keys-mobile").classList.remove("hidden"); }
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/Web.data.unityweb",
        frameworkUrl: "Build/Web.framework.js.unityweb",
        codeUrl: "Build/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "JoseonLowPolyUnityProject",
        productVersion: "0.1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (p) {
        document.getElementById("fill").style.width = (p * 100) + "%";
        document.getElementById("pct").textContent = "불러오는 중… " + Math.round(p * 100) + "%";
      }).then(function () {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("start").classList.remove("hidden");
      }).catch(function (message) { document.getElementById("pct").textContent = "실행할 수 없습니다: " + message; });
      document.getElementById("go").onclick = function () {
        document.getElementById("start").classList.add("hidden");
        canvas.focus();
        if (mobile && document.documentElement.requestFullscreen)
          document.documentElement.requestFullscreen().then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); }).catch(function () {});
      };
    </script>
  </body>
</html>
